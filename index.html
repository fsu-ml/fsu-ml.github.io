<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Weekly conversations on AI, machine learning, scientific computing, and applied research."
    >
    <meta name="theme-color" content="#782f40">
    <link rel="canonical" href="https://sc-ai.net/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="FSU SC Artificial Intelligence Seminar">
    <meta property="og:title" content="FSU SC Artificial Intelligence Seminar">
    <meta
      property="og:description"
      content="Weekly conversations on AI, machine learning, scientific computing, and applied research at Florida State University."
    >
    <meta property="og:url" content="https://sc-ai.net/">
    <meta property="og:image" content="https://sc-ai.net/images/banner-wide.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="FSU SC Artificial Intelligence Seminar">
    <meta
      name="twitter:description"
      content="Weekly conversations on AI, machine learning, scientific computing, and applied research at Florida State University."
    >
    <meta name="twitter:image" content="https://sc-ai.net/images/banner-wide.png">
    <title>FSU SC Artificial Intelligence Seminar</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EventSeries",
        "name": "FSU SC Artificial Intelligence Seminar",
        "url": "https://sc-ai.net/",
        "description": "Weekly conversations on AI, machine learning, scientific computing, and applied research.",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "location": [
          {
            "@type": "Place",
            "name": "DSL/SC-499, Dirac Science Library, Florida State University",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Tallahassee",
              "addressRegion": "FL",
              "addressCountry": "US"
            }
          },
          {
            "@type": "VirtualLocation",
            "url": "https://fsu.zoom.us/j/9038137210"
          }
        ],
        "organizer": {
          "@type": "Organization",
          "name": "FSU Department of Scientific Computing",
          "url": "https://www.sc.fsu.edu"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap"
    >
    <link rel="preload" href="images/banner-wide-half-dark.png" as="image">
    <link rel="stylesheet" href="static/styles.css">
    <script type="module" src="static/app.js"></script>
  </head>
  <body>
    <header class="site-header" data-site-header>
      <nav class="nav-shell" aria-label="Primary navigation">
        <a class="brand" href="/" aria-label="FSU SC Artificial Intelligence Seminar home">
          <span class="brand-name">FSU Artificial Intelligence Seminar</span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
          <span class="sr-only">Toggle navigation</span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>
        <div class="nav-links" id="site-nav" data-nav-links></div>
      </nav>
    </header>

    <main>
      <section class="hero" id="home" aria-labelledby="hero-title">
        <div class="hero-media" aria-hidden="true"></div>
        <div class="hero-overlay" aria-hidden="true"></div>
        <div class="hero-inner">
          <div class="hero-copy">
            <img
              class="hero-logo"
              src="images/FSU-Scientific-Computing.svg"
              alt="Florida State University Scientific Computing"
            >
            <h1 id="hero-title"><span>Artificial Intelligence</span><span>Seminar</span></h1>
            <p class="hero-subtitle">
              Weekly conversations on AI, machine learning, scientific computing, and applied research.
            </p>
            <div class="hero-actions" data-hero-actions></div>
          </div>
          <aside class="next-seminar" aria-label="Next seminar" data-next-seminar></aside>
        </div>
      </section>

      <section class="section section-overview" id="why-attend" aria-labelledby="why-attend-title">
        <div class="section-inner split-layout">
          <div class="section-copy">
            <h2 id="why-attend-title">Who We Are</h2>
            <p data-overview-intro></p>
          </div>
          <div class="feature-grid" data-feature-grid></div>
          <p class="overview-guide-link" data-overview-link></p>
        </div>
      </section>

      <section class="section section-dashboard" aria-label="Seminar dashboard">
        <div class="section-inner dashboard-layout">
          <article class="dashboard-panel dashboard-panel-talks" id="schedule" aria-labelledby="talks-title">
            <div class="panel-heading">
              <div>
                <p class="section-kicker" data-schedule-season>Upcoming Talks</p>
                <h2 id="talks-title">Upcoming Talks</h2>
              </div>
              <div class="panel-actions">
                <a class="button-link button-primary panel-button" href="/schedule/" data-schedule-action>View full schedule</a>
              </div>
            </div>
            <div data-schedule-list></div>
          </article>

          <article class="dashboard-panel dashboard-panel-roster" id="speakers" aria-labelledby="speakers-title">
            <div class="panel-heading">
              <div>
                <p class="section-kicker" data-speakers-season>Seminar Speakers</p>
                <h2 id="speakers-title">Who's Presenting</h2>
              </div>
              <div class="panel-actions">
                <a class="button-link button-primary panel-button" href="/speakers/" data-speakers-action>View all speakers</a>
              </div>
            </div>
            <div class="speaker-roster-grid" data-speaker-grid></div>
          </article>

          <article class="dashboard-panel dashboard-panel-community" id="community" aria-labelledby="community-title">
            <div class="panel-heading">
              <div>
                <h2 id="community-title">Join the Community</h2>
              </div>
            </div>
            <div class="community-grid" data-community-grid></div>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-media" aria-hidden="true"></div>
      <div class="footer-inner" data-footer></div>
    </footer>
  </body>
</html>
