<article class="speaker-card" data-reveal="scale">
  <a class="speaker-media" href="{{ website }}" aria-label="{{ name }}">
    {{ imageMarkup }}
    <span {{ initialsHidden }}>{{ initials }}</span>
  </a>
  <div class="speaker-body">
    <h3>{{ name }}</h3>
    <p>{{ title }}</p>
    <p>{{ department }}</p>
    <p>{{ affiliation }}</p>
    <span class="speaker-topic">{{ topic }}</span>
  </div>
</article>
