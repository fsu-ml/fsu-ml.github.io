<article class="schedule-item" data-reveal="up">
  <div class="date-badge" aria-label="{{ month }} {{ day }}">
    <span class="date-month">{{ month }}</span>
    <span class="date-day">{{ day }}</span>
  </div>
  <div class="schedule-content">
    <h3>{{ title }}</h3>
    <p>{{ speaker }} · {{ affiliation }}</p>
  </div>
  <span class="tag {{ tagColor }}">{{ tag }}</span>
</article>
